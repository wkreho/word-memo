<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Word Memo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="study-view" class="study-shell">
    <header class="study-header">
      <div>
        <h1>English Word Memo</h1>
        <p id="selected-decks">단어장을 선택해 주세요.</p>
        <p id="load-status" role="status" aria-live="polite"></p>
        <p id="storage-status" role="status" hidden>이 브라우저에서는 학습 기록을 저장할 수 없습니다.</p>
      </div>
      <div class="toolbar">
        <button id="deck-btn" class="source-btn primary" type="button" disabled>단어장 선택</button>
        <button id="quiz-btn" class="source-btn primary" type="button" disabled>퀴즈 준비</button>
      </div>
    </header>

    <dialog id="deck-dialog" aria-labelledby="deck-title">
      <h2 id="deck-title">단어장 선택</h2>
      <p id="deck-draft-count" role="status"></p>
      <div id="deck-tree" class="deck-tree"></div>
      <div class="toolbar">
        <button id="deck-apply" class="source-btn primary" type="button">선택 적용</button>
        <button id="deck-clear" class="source-btn" type="button">선택 초기화</button>
        <button id="deck-cancel" class="source-btn" type="button">취소</button>
      </div>
    </dialog>

    <div class="toolbar" role="group" aria-label="암기 표 보기">
      <button class="source-btn" type="button" data-column="english" aria-pressed="true">영어 정의</button>
      <button class="source-btn" type="button" data-column="synonyms" aria-pressed="false">동의어</button>
      <label for="hidden-column">열 숨기기</label>
      <select id="hidden-column">
        <option value="">마우스에 따라 숨기기</option>
        <option value="none">모두 표시</option>
        <option value="0">단어</option>
        <option value="1">한국어</option>
        <option value="2">영어 정의 / 동의어</option>
      </select>
    </div>
    <div class="toolbar" role="group" aria-label="단어 순서와 표시">
      <button id="shuffle-btn" class="source-btn" type="button">🔀 섞기</button>
      <button id="hide-checked-btn" class="source-btn" type="button">☑️ 체크된 항목 숨기기</button>
      <button id="show-all-btn" class="source-btn" type="button">🔄 모두 보이기</button>
    </div>
    <div class="toolbar" role="group" aria-label="학습 상태">
      <button id="select-all-btn" class="source-btn" type="button">전체 선택</button>
      <button id="clear-all-btn" class="source-btn" type="button">전체 해제</button>
      <button id="reset-progress" class="source-btn secondary" type="button">학습 기록 초기화</button>
    </div>
    <dialog id="quiz-setup" aria-labelledby="quiz-setup-title">
      <h2 id="quiz-setup-title">퀴즈 준비</h2>
      <p id="quiz-target-count"></p>
      <fieldset>
        <legend>시험 방향</legend>
        <label><input type="radio" name="quiz-direction" value="en-ko" checked>영어 → 한국어</label>
        <label><input type="radio" name="quiz-direction" value="ko-en">한국어 → 영어</label>
      </fieldset>
      <p id="quiz-setup-message" role="status"></p>
      <div class="quiz-setup-actions">
        <button id="start-quiz-btn" class="source-btn" type="button">퀴즈 시작</button>
        <button id="cancel-quiz-setup" class="source-btn" type="button">돌아가기</button>
      </div>
    </dialog>
    <div class="range-controls" role="group" aria-label="보이는 행 구간 선택">
      <span>구간:</span>
      <input id="range-start" class="range-input" type="number" min="1" step="1"
        inputmode="numeric" placeholder="시작" aria-label="시작 번호" aria-describedby="visible-count selection-status">
      <span>~</span>
      <input id="range-end" class="range-input" type="number" min="1" step="1"
        inputmode="numeric" placeholder="끝" aria-label="끝 번호" aria-describedby="visible-count selection-status">
      <button id="select-range-btn" class="source-btn" type="button">구간 선택</button>
      <button id="clear-range-btn" class="source-btn" type="button">구간 해제</button>
      <span id="visible-count"></span>
    </div>
    <p id="selection-status" role="status" aria-live="polite"></p>
    <table id="vocab-table">
      <thead>
        <tr><th scope="col">단어</th><th scope="col">한국어</th><th id="detail-heading" scope="col">영어 정의</th><th scope="col">체크</th></tr>
      </thead>
      <tbody id="vocab-body"></tbody>
    </table>
  </main>

  <main id="quiz-view" class="quiz-shell" hidden>
    <header class="topbar">
      <div><h1>영어 퀴즈</h1><p id="direction-label"></p></div>
      <button id="cancel-quiz" type="button">취소하고 돌아가기</button>
    </header>

    <section id="question-panel" aria-label="퀴즈 문제" hidden>
      <div class="question-area">
        <p id="progress"></p>
        <h2 id="question"></h2>
      </div>
      <div>
        <label class="answer-label" id="answer-label" for="answer-input">정답 입력</label>
        <input id="answer-input" type="text" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" aria-describedby="answer-message">
        <p id="answer-message" role="status"></p>
      </div>
      <div class="actions">
        <button id="submit-answer" type="button">제출</button>
        <button id="next-question" type="button" hidden>다음 문제</button>
        <button id="show-hint" type="button" aria-controls="hint-box" aria-expanded="false">힌트 보기</button>
      </div>
      <div id="hint-box" class="info-box" hidden>
        <p id="hint-label">Hint</p><p id="hint-text"></p>
      </div>
      <div id="feedback" class="info-box" role="status" hidden>
        <h3 id="feedback-title"></h3>
        <dl class="answer-detail">
          <dt>정답</dt><dd id="correct-word"></dd>
          <dt>뜻</dt><dd id="correct-korean"></dd>
        </dl>
        <p id="submitted-answer"></p>
        <p id="example-sentence" lang="en" hidden></p>
      </div>
    </section>

    <section id="result-panel" aria-labelledby="result-title" hidden>
      <h2 id="result-title">퀴즈 완료</h2>
      <dl id="result-stats">
        <div><dt>이번 회차 총 문제</dt><dd id="result-total"></dd></div>
        <div><dt>정답</dt><dd id="result-correct"></dd></div>
        <div><dt>오답</dt><dd id="result-wrong"></dd></div>
        <div><dt>정답률</dt><dd id="result-rate"></dd></div>
      </dl>
      <p id="cumulative-result"></p>
      <div class="actions">
        <button id="retry-wrong" type="button">오답만 다시 시험</button>
        <button id="return-to-study" class="primary" type="button">단어 암기로 돌아가기</button>
      </div>
    </section>

    <footer class="keyboard-help" id="keyboard-help">Enter: 답 제출 · 피드백을 확인한 뒤 Enter: 다음 문제</footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
